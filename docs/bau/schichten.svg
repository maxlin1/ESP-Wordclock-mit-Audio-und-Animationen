<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" font-family="Helvetica, Arial, sans-serif">
  <title>Aufbau einer Wortuhr im Schnitt</title>
  <rect width="1180" height="420" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#1d2b3a">Aufbau im Schnitt (von der Seite)</text>
  <text x="30" y="58" font-size="14" fill="#5b6b7c">vorne = links · Licht der LEDs geht nach links durch Gitter, Diffusor und die Buchstaben</text>
  <!-- light arrows -->
  <g stroke="#f2b705" stroke-width="3" fill="#f2b705">
    <path d="M370 150 H150"/><path d="M150 150 l14 -8 v16 z"/>
    <path d="M370 250 H150"/><path d="M150 250 l14 -8 v16 z"/>
  </g>
  <!-- front -->
  <rect x="120" y="90" width="10" height="250" fill="#3a3d44"/>
  <rect x="120" y="140" width="10" height="20" fill="#ffffff"/>
  <rect x="120" y="240" width="10" height="20" fill="#ffffff"/>
  <!-- diffusor -->
  <rect x="134" y="90" width="12" height="250" fill="#e9e4d6" stroke="#b9b3a2"/>
  <!-- grid -->
  <g fill="#2b2e35">
    <rect x="150" y="90" width="230" height="6"/><rect x="150" y="197" width="230" height="6"/><rect x="150" y="334" width="230" height="6"/>
  </g>
  <!-- LED board with LEDs -->
  <rect x="384" y="90" width="22" height="250" fill="#c9a26b"/>
  <rect x="372" y="140" width="12" height="20" fill="#f7f7f7" stroke="#888"/>
  <rect x="372" y="240" width="12" height="20" fill="#f7f7f7" stroke="#888"/>
  <!-- back / electronics -->
  <rect x="470" y="90" width="12" height="250" fill="#6b7280"/>
  <rect x="420" y="200" width="44" height="30" rx="4" fill="#1f5c99"/><text x="442" y="220" font-size="11" fill="#fff" text-anchor="middle">ESP</text>
  <!-- labels -->
  <g font-size="15" fill="#1d2b3a">
    <path d="M125 345 V375 H560" stroke="#999" fill="none"/><text x="570" y="380">1 Front: Edelstahl/Holz/Acryl oder 3D-Druck, Buchstaben ausgeschnitten</text>
    <path d="M140 345 V350" stroke="#999"/>
    <path d="M140 80 V70 H560" stroke="#999" fill="none"/><text x="570" y="75">2 Diffusor: Opal-Acryl 2–3 mm, Transparentpapier oder 0,6 mm weißes PLA</text>
    <path d="M265 86 V100" stroke="#999"/><path d="M265 100 V110 H560" stroke="#999" fill="none"/><text x="570" y="115">3 Lichtgitter: eine Kammer pro Buchstabe, 15–25 mm tief</text>
    <path d="M395 186 H560" stroke="#999"/><text x="570" y="191">4 LED-Streifen auf Trägerplatte (MDF, Siebdruckplatte)</text>
    <path d="M442 236 V280 H560" stroke="#999" fill="none"/><text x="570" y="285">5 Elektronik: ESP32, DFPlayer, BME280, Netzteil</text>
    <path d="M476 340 V330 H560" stroke="#999" fill="none"/><text x="570" y="335">6 Rückwand / Rahmen</text>
  </g>
</svg>
